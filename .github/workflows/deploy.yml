name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release-qualification:
    name: Release qualification
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/full-regression.yml

  build:
    name: Build site
    needs: [ci, release-qualification]
    # Evaluate the skipped optional gate on main, while failing closed on errors.
    if: >-
      always() && needs.ci.result == 'success' &&
      ((github.ref == 'refs/heads/main' && needs.release-qualification.result == 'skipped') ||
      (startsWith(github.ref, 'refs/tags/v') && needs.release-qualification.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
