name: Full regression
run-name: Full regression — ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or full commit SHA to qualify (blank uses selected workflow ref)
        type: string
        default: ''
  workflow_call:
  # Enables manual qualification before this workflow reaches main.
  # Add full-regression to the PR; later commits requalify it.
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  candidate:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-regression')
    name: Identify exact candidate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: commit
        name: Record tested SHA
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Full regression candidate: $sha" >> "$GITHUB_STEP_SUMMARY"

  regression:
    name: Full browser regression (${{ matrix.os }})
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record exact tested SHA
        shell: bash
        env:
          TESTED_SHA: ${{ needs.candidate.outputs.sha }}
        run: echo "Qualified source SHA (only on success) $TESTED_SHA; runner $RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-full-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
