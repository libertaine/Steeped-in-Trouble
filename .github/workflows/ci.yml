name: CI

# Called by Pages on main/tag pushes. No workflow path filters that could
# leave required checks pending. Existing job names remain compatible.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Controlled skipped classification for PR 36"

  checks:
    name: Lint, unit tests, build (${{ matrix.os }})
    needs: changes
    if: always()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: |
          echo "Change classification did not succeed; refusing to pass required validation."
          exit 1
      - name: Documentation-only validation
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Documentation only; runtime checks are unnecessary."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run lint
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm test
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run build

  browser:
    name: Browser smoke tests
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: |
          echo "Change classification did not succeed; refusing to pass required validation."
          exit 1
      - name: Documentation-only validation
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Documentation only; browser qualification is unnecessary."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      - if: needs.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run test:browser:smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
